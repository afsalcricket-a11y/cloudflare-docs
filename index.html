<script>
const SB_URL='https://bunbqappmhcuzyyjvrpv.supabase.co',SB_KEY='sb_publishable_Vk_N_FRdKWzNxrIQnWraOg_t5OJkzs8';
const sb=supabase.createClient(SB_URL,SB_KEY),$=s=>document.querySelector(s);
const TEAMS=['CSK','MI','RCB','KKR','DC','SRH','RR','PBKS','GT','LSG'];
const COL={CSK:'#c9a200',MI:'#1b6ed1',RCB:'#d4202a',KKR:'#5b2a86',DC:'#2f6bd1',SRH:'#f26b21',RR:'#e8479b',PBKS:'#d9232d',GT:'#1f3a5f',LSG:'#0891b2'};
const KEY={rooms:'code',members:'room',room_teams:'room',room_players:'room',trades:'room',chat:'room',retention:'room',ret_lock:'room'};
const S={code:null,uid:null,rooms:null,members:[],room_teams:[],open:[],room_players:[],trades:[],chat:[],retention:[],ret_lock:[],P:{},on:[],tab:'chat',ev:[],ex:{},mt:'up',snd:localStorage.getItem('snd')!=='0',tf:{},off:0};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cr=n=>'₹'+(+n).toFixed(2)+' Cr',inc=b=>b<1?.05:b<2?.1:b<5?.2:.25;
const me=()=>S.members.find(m=>m.uid==S.uid),myT=()=>me()?.team,isAdmin=()=>S.rooms?.admin==S.uid;

async function rpc(f,a){const{error}=await sb.rpc(f,a);if(error)alert(error.message);return !error}
const ad=(act,p)=>rpc('admin_do',{c:S.code,act,p}),bid=()=>rpc('place_bid',{c:S.code}),pick=t=>rpc('pick_team',{c:S.code,t}),rt=(i,ok)=>rpc('respond_trade',{i,ok});
async function enter(c){S.code=c;localStorage.setItem('room',c);await Promise.all(Object.keys(KEY).map(ld));
 if(!S.rooms)return leave();sub();S.ready=true;render()}
function leave(){localStorage.removeItem('room');location.reload()}
function sub(){const ch=sb.channel('r'+S.code,{config:{presence:{key:S.uid}}});
 Object.keys(KEY).forEach(t=>ch.on('postgres_changes',{event:'*',schema:'public',table:t,filter:KEY[t]+'=eq.'+S.code},async()=>{await ld(t);render()}));
 ch.on('presence',{event:'sync'},()=>{S.on=Object.keys(ch.presenceState());render()}).subscribe(s=>s=='SUBSCRIBED'&&ch.track({t:1}))}
function render(){const a=document.activeElement,id=a?.id,v=a?.value,p=a?.selectionStart;
 $('#app').innerHTML=S.code?room():home();
 if(id){const e=document.getElementById(id);if(e){e.value=v;e.focus();try{e.setSelectionRange(p,p)}catch{}}}}
async function mk(){if(!S.nm)return alert('Enter your name');const{data,error}=await sb.rpc('create_room2',{nm:S.nm,md:S.md||'m1'});if(error)return alert(error.message);enter(data)}
async function jn(){const c=(S.cc||'').trim().toUpperCase();if(!S.nm||!c)return alert('Enter name and code');if(await rpc('join_room',{c,nm:S.nm}))enter(c)}
const lobby=()=>`<div class=c><b>Pick your team</b><div class=g>${TEAMS.map(t=>{const o=S.members.find(m=>m.team==t),x=o&&o.uid!=S.uid;
 return `<button style="background:${COL[t]};color:#fff;${x?'opacity:.35':''}" ${x?'disabled':''} onclick="pick('${t}')">${t}<br><small>${o?esc(o.name):'free'}</small></button>`}).join('')}</div>
<p class=m>In room: ${S.members.map(m=>esc(m.name)).join(', ')}</p>${isAdmin()?`<button onclick="go()">▶ Start auction</button>`:'<p class=m>Waiting for the host to start…</p>'}</div>`;
const done=()=>S.room_players.filter(x=>x.status!='pending').sort((a,b)=>b.sold_at.localeCompare(a.sold_at));
function admin(){const r=S.rooms;if(!isAdmin()||r.status=='lobby'||r.status=='ended'||r.phase=='retention')return '';const pend=S.room_players.filter(x=>x.status=='pending');
 return `<div class=c><b>Host controls</b> <span class=m>${pend.length} players left</span><div class=row>
${r.status=='paused'?`<button onclick="ad('resume')">Resume</button>`:`<button class=s onclick="ad('pause')">Pause</button>`}
<button class=s onclick="ad('skip')">Skip</button><button class=s onclick="confirm('End auction?')&&ad('end')">End</button></div>
</div>`}
const teams=()=>`<div class=g>${[...S.room_teams].sort((a,b)=>TEAMS.indexOf(a.team)-TEAMS.indexOf(b.team)).map(x=>{const o=S.members.find(m=>m.team==x.team);
 return `<div style="border:1px solid ${COL[x.team]};border-radius:10px;padding:8px"><b style="color:${COL[x.team]}">${x.team}</b> <span class=m>${o?esc(o.name):'—'}</span><br>${cr(x.purse)}${(c=>`<br><b style="color:${c.n<18?'#f87171':'inherit'}">${c.n}/25</b> · OS: ${c.os}/8${S.rooms.mode=='m2'&&S.rooms.phase!='retention'?' · RTM: '+x.rtm:''}<br><span class=m>BAT ${c.bat} · WK ${c.wk} · AR ${c.ar} · BOWL ${c.bowl}</span>`)(cnt(x.team))}
<div class=m>${sq(x.team).map(s=>S.P[s.pid].name+' '+cr(s.price)).join('<br>')}</div></div>`}).join('')}</div>`;
const sold=()=>done().map(x=>`<div>${x.status=='sold'?'✅':'❌'} ${S.P[x.pid].name} — ${x.status=='sold'?x.team+' · '+cr(x.price):'Unsold'}</div>`).join('')||'<span class=m>Nothing yet</span>';
const cht=()=>`<div style="max-height:260px;overflow:auto">${S.chat.map(m=>`<div><b>${esc(m.name)}</b> ${esc(m.msg)}</div>`).join('')||'<span class=m>No messages</span>'}</div>
<div class=row style="margin-top:8px"><input id=cm placeholder="Message" style="flex:1" value="${esc(S.cm)}" oninput="S.cm=this.value" onkeydown="event.key=='Enter'&&say()"><button onclick="say()">Send</button></div>`;

const go=()=>S.rooms.mode=='m2'?rpc('start_retention',{c:S.code}):ad('start');
const rtmb=(r,my)=>r.rtm_on?`<p><b>RTM window:</b> ${r.rtm_team} may match ${cr(r.bid)}</p>${my==r.rtm_team?`<button onclick="rpc('rtm_respond',{c:S.code,m:true})">Match (RTM)</button> <button class=s onclick="rpc('rtm_respond',{c:S.code,m:false})">Decline</button>`:''}`:'';
const claim=()=>myT()||!me()||S.rooms.status=='lobby'?'':`<div class=c><b>Claim a team</b> <span class=m>or keep watching as a spectator${S.rooms.late_join?'':' (late joining is off)'}</span><div class=g>${TEAMS.filter(t=>!S.members.some(m=>m.team==t)).map(t=>`<button style="background:${COL[t]};color:#fff" ${S.rooms.late_join?'':'disabled'} onclick="pick('${t}')">${t}</button>`).join('')||'<span class=m>All 10 teams taken: spectating</span>'}</div><p class=m>New owners can bid from the next player.</p></div>`;
const sett=()=>isAdmin()?`<div class=c><b>Room settings</b><div class=row><label>Bid timer <select onchange="setS('bid_sec',+this.value)"><option value=5 ${S.rooms.bid_sec==5?'selected':''}>5s</option><option value=10 ${S.rooms.bid_sec!=5?'selected':''}>10s</option></select></label>${[['late_join','Late joining'],['spectators','Spectators'],['ret_visible','Show retentions live'],['listed','Show in open rooms']].map(([k,l])=>`<label><input type=checkbox ${S.rooms[k]?'checked':''} onchange="setS('${k}',this.checked)"> ${l}</label>`).join('')}</div></div>`:'';
const setS=(k,v)=>{if(k=='listed')return rpc('set_listed',{c:S.code,b:v});const r={...S.rooms,[k]:v};rpc('admin_settings',{c:S.code,late:r.late_join,spec:r.spectators,vis:r.ret_visible,sec:r.bid_sec||10})};
const people=()=>`<div class=c><b>Participants</b> <span class=m>🟢 ${S.on.length} online / ${S.members.filter(m=>!m.removed).length}</span>${S.members.filter(m=>!m.removed).map(m=>`<div>${S.on.includes(m.uid)?'🟢':'⚪'} ${esc(m.name)} <b style="color:${COL[m.team]||'var(--m)'}">${m.team||'spectator'}</b>${isAdmin()&&m.uid!=S.uid?` <button class=s onclick="confirm('Remove?')&&rpc('remove_member',{c:S.code,u:'${m.uid}'})">Remove</button>`:''}${isAdmin()&&m.team?` <select onchange="rpc('transfer_team',{c:S.code,t:'${m.team}',u:this.value})"><option value="">Transfer to…</option>${S.members.filter(x=>!x.removed&&!x.team).map(x=>`<option value=${x.uid}>${esc(x.name)}</option>`).join('')}</select>`:''}</div>`).join('')}</div>`;
const rp=(i,ch)=>rpc('retain_pick',{c:S.code,i,ch});
function ret(){const t=myT(),r=S.rooms,mine=Object.values(S.P).filter(p=>p.team26==t&&p.pool=='v2'),R=id=>S.retention.find(x=>x.pid==id),n=S.retention.filter(x=>x.team==t&&x.choice=='retain').length,lk=S.ret_lock.some(x=>x.team==t);
 const own=t?`<b>Your 2026 squad</b><p class=m>Retain up to 6 (₹18/14/11/9/7/4 Cr in the order you pick; custom rule). <b>Retained: ${n}/6 · RTM cards after retention: ${6-n}</b> ${lk?'· 🔒 locked':''}</p>${mine.map(p=>{const c=R(p.id)?.choice;return `<div class=row><span style="flex:1">${p.name} <span class=m>${p.role}${p.src=='unverified'?' · UNVERIFIED':''}</span></span><button class="${c=='retain'?'':'s'}" ${lk?'disabled':''} onclick="rp(${p.id},'retain')">Retain</button><button class="${c=='release'?'':'s'}" ${lk?'disabled':''} onclick="rp(${p.id},'release')">Release</button></div>`}).join('')}<br><button ${lk?'disabled':''} onclick="rpc('lock_retention',{c:S.code})">Lock my choices</button>`:'<p class=m>Spectating the retention phase.</p>';
 return `<div class=c><h2 style="margin:0">Retention phase</h2><p class=m>Locked: ${S.ret_lock.map(x=>x.team).join(', ')||'none'} · ${r.ret_visible?'choices visible live':'choices hidden until retention ends'}</p><div class=m>${S.members.filter(m=>m.team&&!m.removed).map(m=>{const c=S.retention.filter(x=>x.team==m.team&&x.choice=='retain').length;return m.team+': '+(m.team==t||r.ret_visible?`Retained ${c}/6 · RTM after: ${6-c}`:'hidden')+(S.ret_lock.some(x=>x.team==m.team)?' 🔒':'')}).join('<br>')}</div>${own}${isAdmin()?`<br><br><button onclick="rpc('finish_retention',{c:S.code})">Finish retention → start mega auction</button>`:''}</div>`}

const cnt=t=>{const a=sq(t).map(s=>S.P[s.pid]);return{n:a.length,os:a.filter(p=>p.country=='Overseas').length,bat:a.filter(p=>p.role=='Batter').length,wk:a.filter(p=>p.role=='WK-Batter').length,ar:a.filter(p=>p.role=='All-rounder').length,bowl:a.filter(p=>/^Bowler/.test(p.role)).length}};
const capHit=p=>{if(S.rooms.mode=='classic'||!myT())return '';const c=cnt(myT());return c.n>=25?'Squad full 25/25':p.country=='Overseas'&&c.os>=8?'Overseas full 8/8':''};
const share=()=>navigator.clipboard.writeText(location.origin+location.pathname+'?room='+S.code).then(()=>alert('Room link copied'),()=>prompt('Copy this link',location.origin+location.pathname+'?room='+S.code));
const reqb=()=>isAdmin()&&S.rooms.phase!='retention'&&S.rooms.status!='lobby'&&!S.room_players.some(x=>x.status=='pending')&&S.room_players.some(x=>x.status=='unsold')?`<div class=c><button onclick="rpc('requeue_unsold',{c:S.code})">Re-auction unsold players</button></div>`:'';
async function refOpen(q){const{data}=await sb.rpc('open_rooms');S.open=data||[];if(!q)render()}
const leftInSet=p=>S.room_players.filter(x=>x.status=='pending'&&x.pid!=p.id&&(S.P[x.pid]?.set_order||1)==(p.set_order||1)).length;
const setsT=()=>{const r=S.rooms,g={};S.room_players.filter(x=>x.status=='pending'&&x.pid!=r.cur).forEach(x=>{const p=S.P[x.pid];if(p){const o=p.set_order||1;(g[o]=g[o]||{n:p.set_name||'All players',a:[]}).a.push(p.name)}});
 const cs=S.P[r.cur]?(S.P[r.cur].set_order||1):0,ks=Object.keys(g).sort((a,b)=>a-b);
 return ks.length?ks.map(o=>`<details ${(S.os?.[o]??(o==cs))?'open':''}><summary onclick="(S.os=S.os||{})[${o}]=!this.parentNode.open"><b>Set ${o} · ${esc(g[o].n)}</b> — ${g[o].a.length} left${o==cs?' · on the block now':''}</summary><div class=m>${g[o].a.sort().map(esc).join(', ')}</div></details>`).join(''):'<span class=m>No players remaining in any set</span>'};
const FILT={all:['All',()=>1],capped:['Capped',p=>p.set_order&&p.set_order<8],unc:['Uncapped',p=>p.set_order>=8],ind:['Indian',p=>p.country=='India'],os:['Overseas',p=>p.country!='India'],bat:['Batters',p=>p.role=='Batter'],wk:['WK',p=>p.role=='WK-Batter'],ar:['All-rounders',p=>p.role=='All-rounder'],fast:['Fast',p=>p.role=='Bowler (pace)'],spin:['Spin',p=>p.role=='Bowler (spin)']};
const remList=()=>S.room_players.filter(x=>x.status=='pending'&&x.pid!=S.rooms.cur).map(x=>S.P[x.pid]).filter(Boolean);
const pcd=p=>`<div class=pcard><img src="https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}&size=72&background=2c365a&color=f5c542&bold=true"><div><b>${esc(p.name)}</b><div class=m>${esc(p.country)} · ${esc(p.role)} · ${p.set_order?(p.set_order<8?'Capped':'Uncapped'):'—'} · ${cr(p.base)}</div></div></div>`;
function leftP(){const all=remList(),f=FILT[S.f||'all'],q=(S.q||'').toLowerCase(),sf=S.sf||0;
 const L=all.filter(p=>f[1](p)&&(!sf||(p.set_order||1)==sf)&&(p.name+' '+p.country).toLowerCase().includes(q)).sort((a,b)=>(a.set_order||1)-(b.set_order||1)||a.name.localeCompare(b.name));
 return `<div class=c><b>Remaining players: ${all.length}</b><input id=qs placeholder="Search name or country" value="${esc(S.q)}" oninput="S.q=this.value;render()" style="width:100%;margin:6px 0"><div class=row>${Object.entries(FILT).map(([k,v])=>`<button class="chip ${(S.f||'all')==k?'':'s'}" onclick="S.f='${k}';render()">${v[0]} ${all.filter(v[1]).length}</button>`).join('')}</div>${sf?`<p class=m>Showing Set ${sf} only <button class="chip s" onclick="S.sf=0;render()">clear</button></p>`:''}<div style="max-height:320px;overflow:auto;margin-top:6px">${L.slice(0,40).map(pcd).join('')||'<span class=m>No matches</span>'}${L.length>40?`<p class=m>Showing 40 of ${L.length}. Refine the search.</p>`:''}</div><p class=m>Capped status and base prices are custom estimates.</p></div>`+setsNav()}
function setsNav(){const r=S.rooms,g={};S.room_players.forEach(x=>{const p=S.P[x.pid];if(!p)return;const o=p.set_order||1,e=g[o]=g[o]||{n:p.set_name||'All players',t:0,l:0,s:0,u:0};e.t++;if(x.status=='sold')e.s++;else if(x.status=='unsold')e.u++;else if(x.pid!=r.cur)e.l++});
 const cs=r.cur?(S.P[r.cur]?.set_order||1):0;
 return `<div class=c><b>Sets</b>${Object.keys(g).sort((a,b)=>a-b).map(o=>{const e=g[o],st=o==cs?'▶ live':e.l==0?'✅ done':'⏳ pending';return `<div class=pcard style="display:block"><div><b>Set ${o} · ${esc(e.n)}</b> <span class=m>${st}${r.force_set==o?' · queued next':''}</span></div><div class=m>Total ${e.t} · Left ${e.l} · Sold ${e.s} · Unsold ${e.u} <button class="chip s" onclick="S.sf=${o};render()">View</button>${isAdmin()&&e.l>0&&r.phase!='retention'&&r.status!='lobby'?` <button class="chip s" onclick="rpc('select_set',{c:S.code,n:${o}})">Run next</button>`:''}</div></div>`}).join('')}</div>`}

const ROLE={'Batter':['BAT','#3b82f6'],'WK-Batter':['WK','#f59e0b'],'All-rounder':['AR','#8b5cf6'],'Bowler (pace)':['BOWL','#ef4444'],'Bowler (spin)':['BOWL','#ef4444']};

const pill=(t,c)=>`<span class=pill style="background:${c}22;color:${c};border:1px solid ${c}55">${t}</span>`,bdg=t=>`<span class=bd style="background:${COL[t]||'#334'}">${t}</span>`;
const rpl=p=>{const r=ROLE[p.role]||['ROLE?','#64748b'];return pill(r[0],r[1])+(p.country!='India'?pill('OS','#8b5cf6'):'')};
let AC;const beep=(f,d,t='sine',v=.06)=>{if(!S.snd)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch{}};
const ding=()=>beep(880,.25),gavel=()=>{beep(180,.18,'square',.08);setTimeout(()=>beep(120,.25,'square',.08),140)};
const snd=()=>{S.snd=!S.snd;localStorage.setItem('snd',S.snd?'1':'0');render()};
function confetti(){const d=document.createElement('div');d.className='cf';d.innerHTML=Array.from({length:36},(_,i)=>`<i style="left:${Math.random()*100}%;background:${['#10b981','#f59e0b','#8b5cf6','#3b82f6','#ef4444'][i%5]};animation-delay:${Math.random()*.4}s"></i>`).join('');document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
async function ld(t){let q=sb.from(t).select().eq(KEY[t],S.code);if(t=='chat')q=q.order('id',{ascending:false}).limit(60);
 const{data}=await q,old=S[t],nw=t=='rooms'?data?.[0]:data||[];S[t]=nw;evt(t,old,nw)}
function evt(t,o,n){if(!o||!n||S.ready!==true)return;const now=Date.now();
 if(t=='rooms'){if(o.cur&&o.cur==n.cur&&n.bidder&&(n.bidder!=o.bidder||+n.bid!=+o.bid)){S.ev.push({t:now,m:`🔨 ${n.bidder} bid ${cr(n.bid)}`});ding()}
  if(!n.cur&&n.res_kind&&n.res_pid&&n.res_until!=o.res_until){S.ev.push({t:now,m:n.res_kind=='sold'?`🏆 SOLD: ${S.P[n.res_pid]?.name} to ${n.res_team} for ${cr(n.res_price)}`:`❌ UNSOLD: ${S.P[n.res_pid]?.name}`,k:n.res_kind});if(n.res_kind=='sold'){gavel();confetti()}}}
 if(t=='members'){const was=new Set(o.map(m=>m.uid));n.filter(m=>!was.has(m.uid)).forEach(m=>S.ev.push({t:now,m:`🟢 ${esc(m.name)} joined`}))}}
const openr=()=>`<div class=c><div class=row2><b>Live open rooms</b><span class=pill style="background:#10b98122;color:#10b981;border:1px solid #10b98155">${S.open.length}</span><span style="flex:1"></span><button class=ib onclick="refOpen()">↻</button></div>${S.open.map(r=>`<div class=pl><b class=am>${r.code}</b><span class=m>${r.mode} · ${r.status} · host ${esc(r.host)} · ${r.free} free</span><span style="flex:1"></span><button class=ib onclick="S.cc='${r.code}';jn()">Join</button></div>`).join('')||'<p class=m>No open rooms</p>'}</div>`;
const home=()=>`<div class=cd style="text-align:center"><h1 style="font-size:26px;margin:4px">🏏 IPL Auction Game</h1><div class=m>Play with Friends • No Sign Up Required</div></div><div class=c><input id=nm placeholder="Your Name" value="${esc(S.nm)}" oninput="S.nm=this.value" style="width:100%"><div class=m style="margin:10px 0 4px">Choose mode</div><div class=row2 style="flex-wrap:wrap">${[['m1','Mode 1','IPL 2027 Full Auction'],['m2','Mode 2','2026 Retention + Mega Auction + RTM'],['classic','Classic','30 sample players']].map(([k,t,d])=>`<div class="mode ${(S.md||'m1')==k?'on':''}" onclick="S.md='${k}';render()"><b>${t}</b><div class=m>${d}</div></div>`).join('')}</div><br><button class=bb style="width:100%" onclick="mk()">Create Room</button><hr style="border-color:#24242c"><div class=row2><input id=cc placeholder="Room code" value="${esc(S.cc)}" oninput="S.cc=this.value" style="flex:1;text-transform:uppercase"><button onclick="jn()">Join</button></div></div>${openr()}<details class=c><summary><b>How to Play &amp; Auction Rules</b></summary><div class=m style="margin-top:8px">• One host creates a room; friends join with the code or link.<br>• Each friend picks one franchise (₹120 Cr purse, max 25 players, max 8 overseas).<br>• Players come up in sets. Tap BID to raise; the timer resets on every bid.<br>• Highest bid when the timer ends wins the player. Late joiners bid from the next player.<br>• Mode 2: retain up to 6 players first; each team gets (6 − retained) RTM cards.<br>• Spectators can watch and chat.</div></details>`;
const hdr=()=>{const on=S.on.length,tot=S.members.filter(m=>!m.removed).length,link=location.origin+location.pathname+'?room='+S.code;
 return `<div class=hd><b class=am style="letter-spacing:2px;font-size:18px">${S.code}</b><span class=on>● ${on}/${tot}</span><span style="flex:1"></span><a class=ib href="https://wa.me/?text=${encodeURIComponent('Join my IPL auction! Room '+S.code+' '+link)}" target=_blank rel=noopener>WhatsApp</a><button class=ib onclick="share()">🔗</button><button class=ib onclick="snd()">${S.snd?'🔔':'🔕'}</button><button class=ib onclick="leave()">Exit</button></div>`};
const strip=()=>{const t=myT(),r=S.rooms;if(!me())return '';
 if(!t){const free=TEAMS.filter(x=>!S.members.some(m=>m.team==x));return `<div class=strip>👁️ Watching as spectator ${free.length&&(r.status=='lobby'||r.late_join)?`<select onchange="pick(this.value)"><option>Pick Team ▾</option>${free.map(x=>`<option>${x}</option>`).join('')}</select>`:''}</div>`}
 const c=cnt(t),rt=S.room_teams.find(x=>x.team==t);return `<div class=strip>${bdg(t)} <b class=gr>${cr(rt?.purse??120)}</b> · OS: ${c.os}/8 · Squad: <b style="color:${c.n<18?'#ef4444':'inherit'}">${c.n}/25</b>${r.mode=='m2'?' · RTM: '+(rt?.rtm??0):''}</div>`};
const nextSet=()=>{const a=S.room_players.filter(x=>x.status=='pending'&&x.pid!=S.rooms.cur).map(x=>S.P[x.pid]).filter(Boolean).sort((a,b)=>(a.set_order||1)-(b.set_order||1))[0];return a?(a.set_name||'Set '+(a.set_order||1)):'Auction complete'};
const banner=r=>{const l=r.res_until?Date.parse(r.res_until)-(Date.now()+S.off):0,pn=esc(S.P[r.res_pid]?.name),paused=r.status=='paused';
 if(r.res_setdone&&r.res_pid&&((l<=4000&&l>0)||(paused&&r.left_ms<=4000)))return `<div class="cd ban">✅ <b>${esc(S.P[r.res_pid]?.set_name||'Set')}</b> Completed!<br><span class=am><b>Up Next: ${esc(nextSet())}</b></span><div class=bar style="margin-top:8px"><i id=rb></i></div></div>`;
 const show=r.res_pid&&(l>(r.res_setdone?4000:0)||paused);
 return `<div class="cd ban">${show&&r.res_kind=='sold'?`<div class="big gr">🔨 SOLD!</div><b>${r.res_team} buys ${pn} for ${cr(r.res_price)}</b>`:show&&r.res_kind=='unsold'?`<div class=big style="color:#ef4444">❌ UNSOLD</div><b>${pn}</b>`:'<b>Next player coming up…</b>'}<div class=bar style="margin-top:8px"><i id=rb></i></div>${paused?'<p class=m>⏸ Paused by host</p>':''}</div>`};
function main(){const r=S.rooms,p=S.P[r.cur],my=myT();
 if(r.status=='ended')return `<div class="cd ban"><h2>🏆 Auction ended</h2><p class=m>Check the 🧳 tab for final squads.</p></div>`;
 if(!p)return banner(r);
 const nb=r.bidder?+r.bid+inc(+r.bid):+p.base,col=COL[r.bidder]||'#24242c',cap=capHit(p),lead=r.bidder==my;
 return `<div class=cd style="border-top:3px solid ${col}"><div class=row2><div style="flex:1;min-width:0"><div>${pill(esc(p.set_name||'Set'),'#f59e0b')} ${rpl(p)}</div><div class=nm>${esc(p.name)}</div><div class=m>Base ${cr(p.base)}${p.team26||p.cur_team?' · 2026: '+(p.team26||p.cur_team):''}<br>${p.src=='verified'?'Squad: ESPNcricinfo-verified':p.src=='unverified'?'Squad: UNVERIFIED':p.src=='list'?'BCCI 2026 auction list':'Sample data'} · base price ${p.base_src&&p.base_src!='custom'?'official':'custom'}</div></div><div style="text-align:right"><div class=m>BID</div><div class="big gr">${cr(r.bidder?r.bid:p.base)}</div><div class=row2 style="justify-content:flex-end;margin-top:6px">${r.bidder?`<span class="bd sq" style="background:${col}">${r.bidder}</span>`:''}<span class=tm id=tm>${r.bid_sec||10} SEC</span></div></div></div><div class=bar style="margin-top:8px"><i id=bar></i></div>${rtmb(r,my)}<div class=row2 style="margin-top:10px"><button class=bb onclick="bid()" ${!my||r.status!='live'||lead||r.rtm_on||(me()?.join_lot>0&&me().join_lot>=r.lot_no)||cap?'disabled':''}>${r.status=='paused'?'⏸ Paused':lead?'You lead':cap||'BID '+cr(nb)}</button><button class="bb s" style="flex:0 0 auto" onclick="S.modal=true;render()">☰ Players</button></div></div>`}
function modal(){if(!S.modal)return '';const R=S.room_players,P=x=>S.P[x.pid],up=remList(),so=R.filter(x=>x.status=='sold'),un=R.filter(x=>x.status=='unsold'),row=(p,r)=>`<div class=pl>${rpl(p)}<b>${esc(p.name)}</b><span style="flex:1"></span>${r}</div>`;let body;
 if(S.mt=='sold')body=so.filter(P).sort((a,b)=>(b.sold_at||'').localeCompare(a.sold_at||'')).map(x=>row(P(x),`${bdg(x.team)} <b class=gr>${cr(x.price)}</b>`)).join('')||'<p class=m>None yet</p>';
 else if(S.mt=='un')body=un.filter(P).map(x=>row(P(x),`<span class=m>${cr(P(x).base)}</span>`)).join('')||'<p class=m>None</p>';
 else{const q=(S.q||'').toLowerCase(),f=FILT[S.f||'all'],g={};up.filter(p=>f[1](p)&&(p.name+' '+p.country).toLowerCase().includes(q)).forEach(p=>{const o=p.set_order||1;(g[o]=g[o]||{n:p.set_name||'Players',a:[]}).a.push(p)});
  body=`<input id=qs placeholder="Search name or country" value="${esc(S.q)}" oninput="S.q=this.value;render()" style="width:100%;margin:6px 0"><div class=row2 style="flex-wrap:wrap">${Object.entries(FILT).map(([k,v])=>`<button class="chip ${(S.f||'all')==k?'':'s'}" onclick="S.f='${k}';render()">${v[0]} ${up.filter(v[1]).length}</button>`).join('')}</div>`+(Object.keys(g).sort((a,b)=>a-b).map(o=>`<div class=sh>${esc(g[o].n)} <span class=m>${g[o].a.length} left</span>${isAdmin()&&S.rooms.status!='lobby'&&S.rooms.phase!='retention'?`<button class=ib onclick="rpc('select_set',{c:S.code,n:${o}})">Run next</button>`:''}</div>`+g[o].a.sort((a,b)=>a.name.localeCompare(b.name)).map(p=>row(p,`<b class=gr>${cr(p.base)}</b>`)).join('')).join('')||'<p class=m>No matches</p>')}
 return `<div class=ov onclick="if(event.target==this){S.modal=false;render()}"><div class=mo><div class=row2><b style="font-size:18px">Auction Stats</b><span style="flex:1"></span><button class=ib onclick="S.modal=false;render()">×</button></div><div class=row2 style="margin:8px 0">${[['up','Up',up.length],['sold','Sold',so.length],['un','Un',un.length]].map(([k,l,n])=>`<button class="tb ${S.mt==k?'on':''}" onclick="S.mt='${k}';render()">${l} [${n}]</button>`).join('')}</div><div class=mb>${body}</div></div></div>`}
const KNOWN=['Batter','WK-Batter','All-rounder','Bowler (spin)','Bowler (pace)'],GRP=[['🏏 BATSMAN',r=>r=='Batter'],['🧤 WICKET-KEEPER',r=>r=='WK-Batter'],['⚡ ALL-ROUNDER',r=>r=='All-rounder'],['🎯 BOWLER',r=>/^Bowler/.test(r)],['❓ ROLE UNVERIFIED',r=>!KNOWN.includes(r)]];
const sqText=t=>{const s=sq(t),rt=S.room_teams.find(x=>x.team==t)||{};return `${t} ${CITY[t]} — IPL Auction ${S.code}\nPurse ${cr(rt.purse??120)} · ${s.length} players\n`+s.map(x=>`• ${S.P[x.pid].name} ${(+x.price).toFixed(1)} Cr`).join('\n')};
const saveSq=t=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([sqText(t)],{type:'text/plain'}));a.download=t+'-squad.txt';a.click()};
const shareSq=t=>navigator.share?navigator.share({text:sqText(t)}).catch(()=>{}):navigator.clipboard.writeText(sqText(t)).then(()=>alert('Squad copied'));
const squads=()=>TEAMS.map(t=>{const m=S.members.find(x=>x.team==t&&!x.removed),rt=S.room_teams.find(x=>x.team==t)||{},s=sq(t),c=cnt(t),spent=s.reduce((a,x)=>a+ +x.price,0),open=S.ex[t],onl=m&&S.on.includes(m.uid);
 const head=`<div class=row2 onclick="S.ex['${t}']=!S.ex['${t}'];render()" style="cursor:pointer;flex-wrap:wrap"><span style="color:${onl?'#10b981':'#555'}">●</span><span>${m?esc(m.name):'<i class=m>open</i>'}${m&&m.uid==S.rooms.admin?' '+pill('HOST','#8b5cf6'):''}</span><span style="flex:1"></span>${bdg(t)} <b>${CITY[t]}</b><span class=m>${s.length} players</span><span>${open?'⌃':'⌄'}</span></div>`;
 const body=open?`<div class=m style="margin:8px 0">OS: ${c.os}/8 · Purse: <b class=gr>${cr(rt.purse??120)}</b> · Spent: <b class=am>${cr(spent)}</b> · Squad: <b style="color:${c.n<18?'#ef4444':'inherit'}">${c.n}/25</b>${S.rooms.mode=='m2'?' · RTM: '+(rt.rtm??0):''}</div><b class=gr>Bought (${s.length})</b>`+GRP.map(([l,f])=>{const a=s.filter(x=>f(S.P[x.pid]?.role||''));return a.length?`<div class=sh>${l} <span class=m>${a.length}</span></div>`+a.map(x=>`<div class=pl><span style="flex:1">${esc(S.P[x.pid].name)} ${S.P[x.pid].country!='India'?'🌐':''}</span><b class=gr>${(+x.price).toFixed(1)} Cr</b></div>`).join(''):''}).join('')+`<div class=row2 style="margin-top:8px"><button class=ib onclick="saveSq('${t}')">📥 Save</button><button class=ib onclick="shareSq('${t}')">🔗 Share</button></div>`:'';
 return `<div class=c>${head}${body}</div>`}).join('');
const items=()=>[...S.chat.map(m=>({t:Date.parse(m.ts),n:m.name,m:m.msg})),...S.ev].sort((a,b)=>b.t-a.t);
const chatT=()=>`<div class=c style="max-height:340px;overflow:auto">${items().map(x=>x.n?`<div class=ev><b>${esc(x.n)}</b> ${esc(x.m)}</div>`:`<div class="ev ${x.k=='sold'?'sold':''}">${x.m}</div>`).join('')||'<span class=m>No messages yet</span>'}</div><div class=row2 style="position:sticky;bottom:6px"><input id=cm placeholder="Message" style="flex:1" value="${esc(S.cm)}" oninput="S.cm=this.value" onkeydown="event.key=='Enter'&&say()"><button class=bb style="flex:0 0 auto;padding:10px 16px;font-size:15px" onclick="say()">Send</button></div>`;
const buildPool=()=>{const b=S.pb||{};rpc('build_pool',{c:S.code,src:b.src||'all',cap:b.cap||'any',org:b.org||'any',rol:b.rol||'any'})};
const OPT=[['src',[['all','All catalog'],['current','Current IPL squads'],['reg26','2026 auction list'],['reg27','2027 registered']]],['cap',[['any','Capped + uncapped'],['capped','Capped'],['uncapped','Uncapped']]],['org',[['any','Any origin'],['india','Indian'],['overseas','Overseas']]],['rol',[['any','Any role'],['Batter','Batters'],['WK-Batter','Wicketkeepers'],['All-rounder','All-rounders'],['Bowler (pace)','Fast bowlers'],['Bowler (spin)','Spin bowlers'],['Role unverified','Role unverified']]]];
const pool=()=>isAdmin()&&S.rooms.status=='lobby'&&S.rooms.mode=='m1'?`<div class=c><b>Pool builder</b> <span class=m>${S.room_players.length} players in pool</span><div class=row2 style="flex-wrap:wrap;margin-top:6px">${OPT.map(([k,o])=>`<select onchange="(S.pb=S.pb||{})['${k}']=this.value">${o.map(([v,l])=>`<option value="${v}" ${(S.pb?.[k]||o[0][0])==v?'selected':''}>${l}</option>`).join('')}</select>`).join('')}<button onclick="buildPool()">Build pool</button></div></div>`:'';
const setT=()=>sett()+admin()+reqb()+pool()+`<div class=c>${trd()}</div>`;
const nav=()=>{const n=items().length;if(S.tab=='chat')S.seenN=n;const b=n-(S.seenN||0);return `<div class=nav>${[['chat','💬',b],['sq','🧳',0],['ppl','👥',0],['set','⚙️',0]].map(([k,i,c])=>`<button class="${S.tab==k?'on':''}" onclick="S.tab='${k}';render()">${i}${c>0?`<span class=bdg>${c}</span>`:''}</button>`).join('')}</div>`};
function room(){const r=S.rooms;return hdr()+strip()+(r.status=='lobby'?lobby():r.phase=='retention'?ret():main())+nav()+(S.tab=='chat'?chatT():S.tab=='sq'?squads():S.tab=='ppl'?people():setT())+modal()}
function tick(){const r=S.rooms;if(!r)return;
 if(!r.cur){const l=r.res_until?Date.parse(r.res_until)-(Date.now()+S.off):0,b=$('#rb');if(b)b.style.width=Math.max(0,Math.min(100,l/(r.res_setdone?75:35)))+'%';
  const ph=!!(r.res_setdone&&l<=4000&&l>0);if(S.ph!==ph||(S.ll>0&&l<=0)){S.ph=ph;render()}S.ll=l;
  if(r.status=='live'&&r.phase!='retention'&&r.res_until&&l<=0&&Date.now()-(S.fa||0)>2000){S.fa=Date.now();setTimeout(()=>sb.rpc('advance',{c:S.code}),Math.random()*700)}return}
 const left=r.status=='paused'?r.left_ms:Math.max(0,Date.parse(r.ends_at)-(Date.now()+S.off)),e=$('#tm');
 if(e){e.textContent=Math.ceil(left/1000)+' SEC';$('#bar').style.width=Math.min(100,left/((r.bid_sec||10)*10))+'%'}
 if(r.status=='live'&&left<=0&&Date.now()-(S.ft||0)>2000){S.ft=Date.now();setTimeout(()=>sb.rpc('finalize',{c:S.code}),Math.random()*800)}}
async function say(){const m=(S.cm||'').trim();if(!m)return;S.cm='';$('#cm').value='';await rpc('send_chat',{c:S.code,m})}
function trd(){const t=myT();if(!t)return 'Pick a team first';const f=S.tf,oth=TEAMS.filter(x=>x!=t&&S.members.some(m=>m.team==x));if(!oth.length)return '<span class=m>No other teams yet</span>';
 const to=oth.includes(f.to)?f.to:oth[0],opt=(tm,s)=>`<option value="">— no player —</option>`+sq(tm).map(x=>`<option value=${x.pid} ${s==x.pid?'selected':''}>${S.P[x.pid].name}</option>`).join('');
 return `<b>Propose a trade</b><div class=row><select onchange="S.tf.to=this.value;S.tf.rp='';render()">${oth.map(x=>`<option ${x==to?'selected':''}>${x}</option>`).join('')}</select></div>
<div class=m>You give</div><div class=row><select onchange="S.tf.gp=this.value">${opt(t,f.gp)}</select> + cash <input id=gc type=number min=0 step=0.1 style="width:80px" value="${f.gc||''}" oninput="S.tf.gc=this.value"> Cr</div>
<div class=m>You get from ${to}</div><div class=row><select onchange="S.tf.rp=this.value">${opt(to,f.rp)}</select> + cash <input id=rc type=number min=0 step=0.1 style="width:80px" value="${f.rc||''}" oninput="S.tf.rc=this.value"> Cr</div><br>
<button onclick="prop('${to}')">Send proposal</button><hr>`+[...S.trades].reverse().map(x=>`<div class=c>${x.from_team} gives ${x.give_pid?S.P[x.give_pid].name:''}${+x.give_cash?' +'+cr(x.give_cash):''} ⇄ ${x.to_team} gives ${x.get_pid?S.P[x.get_pid].name:''}${+x.get_cash?' +'+cr(x.get_cash):''} — <b>${x.status}</b>
${x.status=='pending'&&x.to_team==t?`<br><button onclick="rt(${x.id},true)">Accept</button> <button class=s onclick="rt(${x.id},false)">Reject</button>`:''}</div>`).join('')}
async function prop(to){const f=S.tf;if(await rpc('propose_trade',{c:S.code,to_t:to,gp:+f.gp||null,gc:+f.gc||0,rp:+f.rp||null,rc:+f.rc||0})){S.tf={};render()}}
(async()=>{let session=(await sb.auth.getSession()).data.session;if(!session){const{data,error}=await sb.auth.signInAnonymously();if(error||!data.session){$('#app').innerHTML='<div class=c><b>Sign-in failed</b><p>'+esc(error?.message||'No session returned')+'</p><p class=m>Status: '+esc(error?.status||'none')+' · Code: '+esc(error?.code||'none')+'</p></div>';return}session=data.session}

 S.uid=session.user.id;const q=new URLSearchParams(location.search).get('room');if(q)S.cc=q.toUpperCase();await refOpen(true);const{data:n}=await sb.rpc('srv_now');S.off=Date.parse(n)-Date.now();
 const{data}=await sb.from('players').select();(data||[]).forEach(p=>S.P[p.id]=p);
 const c=localStorage.getItem('room');c?enter(c):render();setInterval(tick,250)})();
</script></body></html>
